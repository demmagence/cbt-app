name: cbt_app
description: "Aplikasi CBT Android untuk admin, guru, dan siswa."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.0

dependencies:
  cloud_firestore: ^6.5.0
  cloud_functions: ^6.4.0
  connectivity_plus: ^7.1.1
  csv: ^8.0.0
  equatable: ^2.0.8
  firebase_auth: ^6.5.2
  firebase_core: ^4.10.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  intl: ^0.20.2
  share_plus: ^13.1.0
  shared_preferences: ^2.5.5
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
